[package]
name = "chess-net"
description = "Online game sources: a player's games from Lichess and Chess.com, into a database (NET-01)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chess-db.workspace = true
log.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Blocking HTTPS (no async runtime): rustls with ring, gzip, and the OS's
# certificate store through the platform verifier.
ureq = { version = "3.4", features = ["platform-verifier"] }

[dev-dependencies]
tempfile.workspace = true

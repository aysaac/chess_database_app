[package]
name = "chess-db"
description = "Native chess database storage: format, import/export, sorting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chess-core.workspace = true
chess-jobs.workspace = true
shakmaty.workspace = true
thiserror.workspace = true
log.workspace = true
# Permanent game ids (NET-13): 16 random bytes each, from the OS.
getrandom = "0.4"
# Study links (NET-13): base snapshots deflated (raw deflate, pure Rust; in the
# tree already through flate2).
miniz_oxide = "0.9"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

# Installers for Linux, Windows and macOS, with Stockfish bundled (ENG-09).
#
# - Pushing a tag `vX.Y.Z` builds every platform and attaches the installers
#   to a *draft* GitHub release named after the tag. Check it, then publish it
#   from the Releases page. The tag must match the version in
#   app/src-tauri/tauri.conf.json (see docs/releasing.md).
# - A pull request that changes this file, or a manual run (Actions → Release →
#   Run workflow), builds the same installers without a release; they are
#   attached to the run as artifacts.
#
# Nothing is code-signed yet: Windows SmartScreen and macOS Gatekeeper warn on
# first launch (the release notes below say how to get past them).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: an AppImage only runs on systems with a glibc at
          # least as new as the one it was built against.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          app="v$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          if [[ "$app" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match tauri.conf.json's version ($app)"
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # The official Stockfish release for the target, checksum-pinned, to
      # app/src-tauri/binaries/stockfish-<target>; tauri.stockfish.json bundles it.
      - name: Fetch Stockfish
        shell: bash
        run: scripts/fetch-stockfish.sh ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }} --config src-tauri/tauri.stockfish.json
          # Empty unless this run is for a tag: then only build, no release.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Chess Database ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            A desktop chess database and analysis app: an open alternative to ChessBase and Fritz.

            ## Download

            | System | File |
            |---|---|
            | Windows | `…_x64-setup.exe` (or the `.msi`) |
            | macOS, Apple silicon | `…_aarch64.dmg` |
            | macOS, Intel | `…_x64.dmg` |
            | Linux | `….AppImage` (any distribution), `.deb` (Debian, Ubuntu) or `.rpm` (Fedora, openSUSE) |

            Stockfish 19 is included; the app finds it on its own.

            ## First launch

            The installers aren't code-signed yet, so the system warns the first time:

            - **Windows:** "Windows protected your PC" → **More info** → **Run anyway**.
            - **macOS:** open the app once, then go to System Settings → Privacy & Security and click **Open Anyway**. If macOS says the app "is damaged", run `xattr -cr "/Applications/Chess Database.app"` in Terminal.
            - **Linux (AppImage):** make the file executable first (`chmod +x` on it, or Properties → Allow executing as program).

            ## Licences

            GPL-3.0-or-later; the source for this version is attached below. The bundled Stockfish is GPL-3.0 too; its source is at https://github.com/official-stockfish/Stockfish/tree/sf_19.

      - name: Attach the installers to the run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg

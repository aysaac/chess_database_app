[workspace]
resolver = "3"
members = [
    "crates/chess-core",
    "crates/chess-jobs",
    "crates/chess-db",
    "crates/chess-engine",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
chess-core = { path = "crates/chess-core" }
chess-jobs = { path = "crates/chess-jobs" }
chess-db = { path = "crates/chess-db" }
chess-engine = { path = "crates/chess-engine" }

shakmaty = "0.30"
pgn-reader = "0.29"
encoding_rs = "0.8"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
tempfile = "3"

[profile.release]
debug = "line-tables-only"

# Optimize the hot paths even in dev builds, so `tauri dev` imports and
# tests run at realistic speed.
[profile.dev.package.shakmaty]
opt-level = 3
[profile.dev.package.pgn-reader]
opt-level = 3
[profile.dev.package.chess-core]
opt-level = 3
[profile.dev.package.chess-db]
opt-level = 3
[profile.dev.package.chess-engine]
opt-level = 3
